name: "Build Push nodejs"

on:
    push:
      branches: [dev__DISABLED]

jobs:
    build-push:
        if: true #you can also use this to disble job true/false
        runs-on: ubuntu-latest
        env:
            DOCKER_USER: ${{ secrets.DOCKER_USER }}
            DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
    # defaults:
        #     run:
        #         shell: bash
        #         working-directory: "app"
        steps:
            - name: checkout
              uses: actions/checkout@v4

            - name: npm install
              run: npm ci

            - name: setup docker
              uses: docker/setup-docker-action@v4

            - name: docker build
              run: docker build -t ${DOCKER_USER}"/express-containerized":${GITHUB_SHA::7} .

            - name: docker login
              run: docker login -u $DOCKER_USER -p $DOCKER_PASSWORD

            - name: docker push
              run: docker push ${DOCKER_USER}"/express-containerized:${GITHUB_SHA::7}"