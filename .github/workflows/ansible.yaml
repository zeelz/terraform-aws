name: "Setup and Start Wacrm App"

on:
  # push

  workflow_run:
    workflows: ["Provision and deploy"]
    types: [completed]

jobs:
  setup-start-wacrm:
    runs-on: ubuntu-latest

    steps:
    # Check out your repository code
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Download artifact from provsioner workflow
      uses: actions/download-artifact@v4
      with:
        name: ip-file-uploader # now ip-var.txt is availble to use in steps
        run-id: ${{ github.event.workflow_run.id }}
        github-token: ${{ secrets.GITHUB_TOKEN }}

    - name: Inject values from file into env vars
      id: injector
      run: |
        while IFS= read -r line; do
          echo "$line" >> "$GITHUB_OUTPUT"
        done < ${{ github.workspace }}/ip-var.txt

    - name: Check GITHUB_OUTPUT
      run: |
        echo 'IP:' ${{ steps.injector.outputs.EC2_IP }}
        ssh -o StrictHostKeyChecking=no ubuntu@54.81.134.63 "echo connected"

