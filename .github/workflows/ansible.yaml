name: "Setup and Start Wacrm App"

on:
  # push

  workflow_run:
    workflows: ["Provision and deploy"]
    types: [completed]

jobs:
  setup-start-wacrm:
    runs-on: ubuntu-latest
    env:
      EC2_IP: ${{ secrets.EC2_IP }}

    steps:
    # Check out your repository code
    - name: Checkout code
      uses: actions/checkout@v4


    - name: downloader
      uses: actions/download-artifact@v4
      with:
        name: ip-file-uploader # now ip-var.txt is availble to use in steps
        run-id: ${{ github.event.workflow_run.id }}
        github-token: ${{ secrets.GITHUB_TOKEN }}

    - name: try file
      run: |
        while IFS= read -r $line; do
          echo "$line" >> "GITHUP_OUTPUT"
        done < ${{ github.workspace }}/ip-var.txt

        echo EC2_UBUNTU_IP

