name: Deploy to Kubernetes

on:
  # push:
  #   branches: [dev]  

  workflow_run:
    workflows: ["Build Push nodejs"]
    types: [completed]

permissions:
  id-token: write
  contents: read

jobs:
  deploy_app:
    if: ${{ github.event.workflow_run.conclusion == 'success' }} # run if triggerer was successful.
    runs-on: ubuntu-latest

    env:
      CLUSTER_NAME: "eks-cluster-08"
      AWS_REGION: "us-east-1"
      HELM_RELEASE: "express-containerized"
      HELM_CHART: "./helm/express-containerized"
      HELM_VALUES: "./helm/express-containerized/values.yaml"

    steps:
      - name: checkout
        uses: actions/checkout@v5

      - name: Download github sha
        uses: actions/download-artifact@v4
        with:
          name: github-sha
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Get commit sha
        run: |
          echo "SHORT_SHA=$( cat github-sha.txt )" >> $GITHUB_ENV

      # Configure AWS
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6.1.0
        with:
          aws-region: us-east-1
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_TO_ASSUME }}

      - name: Update Kubeconfig
        env:
          AWS_REGION: ${{ env.AWS_REGION }}
        run: |
          aws eks update-kubeconfig --name ${{ env.CLUSTER_NAME }}

      # - name: Add Cluster Access entry and policy
      #   run: |
      #     aws eks create-access-entry \
      #     --cluster-name ${{ env.CLUSTER_NAME }} \
      #     --principal-arn ${{ secrets.AWS_OIDC_ROLE_TO_ASSUME }} \
      #     --type STANDARD

      #     aws eks associate-access-policy \
      #     --cluster-name ${{ env.CLUSTER_NAME }} \
      #     --principal-arn ${{ secrets.AWS_OIDC_ROLE_TO_ASSUME }} \
      #     --policy-arn arn:aws:eks::aws:cluster-access-policy/AmazonEKSClusterAdminPolicy \
      #     --access-scope type=cluster

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Helm install release
        run: |
          helm upgrade --install "${HELM_RELEASE}" "${HELM_CHART}" \
          --values "${HELM_VALUES}" \
          --set image.tag=${{ env.SHORT_SHA }}