stages:
  - plan
  - apply
  - docker-push
  - deploy
  - ansible

variables:
  TF_ROOT: "terraform"

image:
  name: registry.gitlab.com/gitlab-org/terraform-images/stable:latest
  entrypoint: [""]

# template
.cd_root_and_init:
  before_script:
    - cd $TF_ROOT
    - terraform init -backend-config="bucket=$TF_STATE_S3_BUCKET" -backend-config="key=terraform.tfstate" -backend-config="region=us-east-1"
  
terraform-plan:
  stage: plan
  rules:
    # - when: never # working but disabled
  extends:
    - .cd_root_and_init
  script:
    - mkdir build
    - terraform plan

  artifacts:
    paths:
      - build/
  allow_failure: false


terraform-apply:
  stage: apply
  dependencies:
    - terraform-plan
  rules:
    # - when: never # working but disabled
  extends:
    - .cd_root_and_init
  script:
    - terraform apply -auto-approve
    # - terraform apply -auto-approve -destroy

    # update CI/CD env var with the new IP for other jobs to use
    - EC2_PUBLIC_IP=$(terraform output -raw zeelz_db_ec2_ip) #terraform output -json > tf-outputs.json # needs jq
    - echo $EC2_PUBLIC_IP > key # for other jobs

    - |
      curl -X PUT \
        --form "value=$EC2_PUBLIC_IP" \
        --header "Authorization: Bearer $GITLAB_PAT_TOKEN" \
        "https://gitlab.com/api/v4/projects/74663565/variables/ZEELZ_EC2_IP"

    # Send EC2 IP to Slack
    - |
      curl -X POST \
        --header "Content-Type: application/json" \
        -d "{\"text\": \"ZEELZ_EC2_IP: $EC2_PUBLIC_IP\"}" \
        $SLACK_WEBHOOK_URL

