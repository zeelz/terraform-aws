ansible:
  image: willhallonline/ansible:latest
  stage: ansible
  dependencies:
    - terraform-apply
  script:
    # Create inventory file
    - echo "[ec2]" > inventory.ini
    - EC2_PUBLIC_IP=$(cat $TF_ROOT/key)
    - echo "$EC2_PUBLIC_IP ansible_user=ubuntu ansible_ssh_private_key_file=$SSH_PRIVATE_KEY" >> inventory.ini
    - chmod 600 $SSH_PRIVATE_KEY # rw- for the key file
    # Run Ansible playbook
    - ansible-playbook -i inventory.ini ansible/playbook.yml


    
docker-build-push:
  stage: docker-push
  image: docker:24
  services:
    - docker:24-dind
  rules:
    # - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - when: never
  variables:
    DOCKER_TLS_CERTDIR: ""
    DOCKER_HOST: tcp://docker:2375
    DOCKER_DRIVER: ""
  dependencies: []

  before_script:
    - echo "$DOCKER_PASSWORD" | docker login --username "$DOCKER_USER" --password-stdin

  script:
    # - cat build/dummy
    - docker build -t $DOCKER_USER/express-gitlab -f Dockerfile.gitlab .
    - docker push $DOCKER_USER/express-gitlab

