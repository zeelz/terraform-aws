docker-build-push:
  stage: docker-push
  image: docker:24
  services:
    - docker:24-dind
  rules:
    # - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    # - when: never

  variables:
    DOCKER_TLS_CERTDIR: ""
    DOCKER_HOST: tcp://docker:2375
    DOCKER_DRIVER: ""

  dependencies: []

  before_script:
    - echo "$DOCKER_PASSWORD" | docker login --username "$DOCKER_USER" --password-stdin

  script:
    # - cat build/dummy
    - docker build -t $DOCKER_USER/express-gitlab:${CI_COMMIT_SHORT_SHA} .
    - docker push $DOCKER_USER/express-gitlab:${CI_COMMIT_SHORT_SHA}