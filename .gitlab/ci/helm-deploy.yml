helm-deploy:
  stage: helm-deploy
  variables:
    CLUSTER_NAME: "eks-cluster-09"
    HELM_RELEASE: "express-containerized"
    HELM_CHART: "./helm/express-containerized"
    HELM_VALUES: "./helm/express-containerized/values.yaml"
    SHORT_SHA: "984c837"
  image: alpine/helm:3.14.0
  extends: [.aws_configure] 
  # dependencies: [docker-build-push]
  script:
    - apk add --no-cache aws-cli
    # Update Kubeconfig
    - aws eks update-kubeconfig --name $CLUSTER_NAME

    - >
      helm upgrade --install "${HELM_RELEASE}" "${HELM_CHART}"
      --values "${HELM_VALUES}"
      --set image.tag=${SHORT_SHA}